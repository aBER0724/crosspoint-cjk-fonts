name: Build font catalog

on:
  pull_request:
    paths:
      - config/**
      - community-fonts/**
      - scripts/**
      - tests/**
      - pages/**
      - requirements.txt
      - .github/workflows/build-fonts.yml
      - .github/workflows/release-fonts.yml
      - .github/workflows/deploy-pages.yml
  push:
    branches: [main]
    paths:
      - config/**
      - community-fonts/**
      - scripts/**
      - tests/**
      - requirements.txt
      - .github/workflows/build-fonts.yml
      - .github/workflows/release-fonts.yml
  workflow_dispatch:
    inputs:
      smoke_family:
        description: "Optional single family for a faster manual smoke build"
        required: false
        default: ""
      sizes:
        description: "Comma-separated physical sizes to build (e.g. 12,14,18). Empty uses the catalog sizes from config/fonts.yaml."
        required: false
        default: ""
      mode:
        description: "manual (build only) | self (build + publish this repo's sd-fonts-m2-b4 Release) | contribute (build + push a submit branch for a PR to upstream)"
        type: choice
        required: false
        default: manual
        options:
          - manual
          - self
          - contribute
  workflow_call:
    inputs:
      smoke_family:
        type: string
        required: false
        default: ""
      sizes:
        description: "Comma-separated physical sizes to build (e.g. 12,14,18). Empty uses the catalog sizes from config/fonts.yaml."
        type: string
        required: false
        default: ""
      mode:
        description: "manual (build only) | self (build + publish this repo's sd-fonts-m2-b4 Release) | contribute (build + push a submit branch for a PR to upstream)"
        type: string
        required: false
        default: manual
      families_json:
        description: "Optional JSON list selected by the incremental release planner"
        type: string
        required: false
        default: ""
      publish_catalog:
        description: "Upload the merged per-family manifest artifact"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: fonts-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  RELEASE_TAG: sd-fonts-m2-b4
  # Resolve to the *current* repository so self-builders get a manifest whose
  # baseUrl points at their own Release instead of upstream's fixed URL.
  FONT_BASE_URL: https://github.com/${{ github.repository }}/releases/download/sd-fonts-m2-b4/

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      families: ${{ steps.catalog.outputs.families }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_config.py
      - run: python -m py_compile scripts/*.py
      - name: Validate custom sizes
        if: inputs.sizes != ''
        env:
          BUILD_SIZES: ${{ inputs.sizes }}
        shell: bash
        run: |
          python - <<'PY'
          import os

          value = os.environ["BUILD_SIZES"]
          parts = [part.strip() for part in value.split(",")]
          if not parts or any(not part for part in parts):
              raise SystemExit("sizes must be a non-empty comma-separated list of positive integers")
          for part in parts:
              try:
                  size = int(part, 10)
              except ValueError:
                  raise SystemExit(f"sizes contains a non-integer value: {part!r}")
              if size <= 0:
                  raise SystemExit("sizes values must be positive integers")
          print("custom sizes validated")
          PY
      - run: python -m unittest discover -s tests -v
      - id: catalog
        name: Select build matrix
        env:
          SMOKE_FAMILY: ${{ inputs.smoke_family }}
          FAMILIES_JSON: ${{ inputs.families_json }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import yaml

          with open("config/fonts.yaml", encoding="utf-8") as source:
              known = [family["name"] for family in yaml.safe_load(source)["families"]]
          selected_json = os.environ.get("FAMILIES_JSON", "").strip()
          smoke = os.environ.get("SMOKE_FAMILY", "").strip()
          if selected_json:
              names = json.loads(selected_json)
              if not isinstance(names, list) or not all(isinstance(name, str) for name in names):
                  raise SystemExit("families_json must be a JSON string list")
          elif smoke:
              names = [smoke]
          else:
              names = known
          unknown = sorted(set(names) - set(known))
          if unknown:
              raise SystemExit("Unknown families: " + ", ".join(unknown))
          if len(names) != len(set(names)):
              raise SystemExit("families_json contains duplicates")
          print("families=" + json.dumps(names, separators=(",", ":")))
          PY

  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (inputs.families_json != '' && inputs.families_json != '[]')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        family: ${{ fromJson(needs.validate.outputs.families) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/fetch_fallback.py
      - id: source
        name: Read family source digest
        shell: bash
        run: echo "sha256=$(python scripts/incremental_release.py source-sha '${{ matrix.family }}')" >> "$GITHUB_OUTPUT"
      - name: Restore source and variable-instance cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: source-${{ matrix.family }}-${{ steps.source.outputs.sha256 }}
      - name: Build font
        shell: bash
        env:
          BUILD_SIZES: ${{ inputs.sizes }}
        run: |
          set -euo pipefail
          args=(--clean --only "${{ matrix.family }}" --base-url "$FONT_BASE_URL")
          if [[ -n "$BUILD_SIZES" ]]; then
            args+=(--sizes "$BUILD_SIZES")
          fi
          python scripts/build_fonts.py "${args[@]}"
      - run: python scripts/verify_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: font-${{ matrix.family }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  catalog:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') &&
      inputs.publish_catalog != false &&
      needs.validate.outputs.families != '[]'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: font-*
          path: dist
          merge-multiple: true
      - run: >-
          python scripts/generate_manifest.py
          --input dist
          --base-url "$FONT_BASE_URL"
          --output dist/fonts.json
          --descriptions-from config/fonts.yaml
      - run: python scripts/verify_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: crosspoint-cjk-fonts
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Scenario 1 (personal use): publish the manually built catalog to THIS
  # repository's sd-fonts-m2-b4 Release so the device can point its font
  # repository setting at owner/repo and download from a stable URL.
  publish-self:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'self'
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crosspoint-cjk-fonts
          path: dist
      - name: Create or update the self-build Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: sd-fonts-m2-b4
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "CrossPoint CJK fonts (self-build)" \
              --notes "Self-built font catalog from a manual workflow run.
          Point your device's font repository at ${{ github.repository }} and reuse tag $RELEASE_TAG."
          fi
          gh release upload "$RELEASE_TAG" dist/fonts.json --clobber
          find dist -maxdepth 1 -name '*.cpfont' -print0 | while IFS= read -r -d '' file; do
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
          echo "Self-build published: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  # Scenario 2 (contribute): after a successful manual build, push the font
  # submission to a submit/<family> branch of THIS (fork) repository and guide
  # the user to open a PR draft to upstream. GitHub's GITHUB_TOKEN cannot open
  # a cross-repo PR from a fork, so the flow is semi-automatic by design.
  push-submit:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'contribute'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push font submission branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/aBER0724/crosspoint-cjk-fonts.git
          git fetch upstream main --quiet
          changed="$(git diff --name-only "upstream/main...HEAD" -- community-fonts/ config/ || true)"
          if [[ -z "$changed" ]]; then
            echo "No changes under community-fonts/ or config/ relative to upstream main; nothing to submit." >&2
            exit 1
          fi
          family="$(printf '%s\n' "$changed" | sed -nE 's#^community-fonts/([^/]+)/.*#\1#p' | sort -u | head -n1)"
          branch="submit/${family:-font-submission}"
          git checkout -b "$branch"
          git add -- community-fonts/ config/
          git commit -m "chore(fonts): submit ${family:-font} for upstream review"
          # Force-update the long-lived submit/<family> branch so repeat runs
          # refine the same PR draft instead of piling up branches.
          git push -u origin "$branch" --force
          pr_url="https://github.com/aBER0724/crosspoint-cjk-fonts/compare/${GITHUB_REPOSITORY_OWNER}:${branch}?expand=1"
          echo "Pushed submission branch: $branch"
          echo "Open this link to create a PR draft to upstream:" >> "$GITHUB_STEP_SUMMARY"
          echo "$pr_url" >> "$GITHUB_STEP_SUMMARY"
