name: Publish font release

on:
  push:
    branches: [main]
    paths:
      - config/fonts.yaml
      - community-fonts/**
      - scripts/build_fonts.py
      - scripts/package_cpfont_families.py
      - scripts/fontconvert_sdcard.py
      - scripts/cpfont_version.py
      - scripts/fetch_fallback.py
      - scripts/incremental_release.py
      - scripts/generate_release_notes.py
      - requirements.txt
      - SOURCES.md
      - RELEASE_NOTES.md
      - .github/workflows/build-fonts.yml
      - .github/workflows/release-fonts.yml
  workflow_dispatch:
    inputs:
      confirm_tag:
        description: "Type sd-fonts-m2-b4 to publish; unchanged families are reused"
        required: true
      force_all:
        description: "Rebuild every family instead of using build fingerprints"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-sd-fonts-m2-b4
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  RELEASE_TAG: sd-fonts-m2-b4
  FONT_BASE_URL: https://github.com/aBER0724/crosspoint-cjk-fonts/releases/download/sd-fonts-m2-b4/
  BOOTSTRAP_REF: sd-fonts-m2-b4

jobs:
  plan:
    if: github.event_name == 'push' || inputs.confirm_tag == 'sd-fonts-m2-b4'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      families_json: ${{ steps.plan.outputs.families_json }}
      changed_existing_json: ${{ steps.plan.outputs.changed_existing_json }}
      new_json: ${{ steps.plan.outputs.new_json }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      has_previous_release: ${{ steps.plan.outputs.has_previous_release }}
      needs_font_publish: ${{ steps.plan.outputs.needs_font_publish }}
      needs_release_update: ${{ steps.plan.outputs.release_update_needed }}
      release_exists: ${{ steps.release.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - id: release
        name: Download current Release metadata when available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p previous
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            gh release download "$RELEASE_TAG" --pattern fonts.json --dir previous
            gh release download "$RELEASE_TAG" --pattern build-index.json --dir previous || true
            gh release view "$RELEASE_TAG" --json assets > previous/assets.json
            gh release view "$RELEASE_TAG" --json body --jq .body > previous/notes.md || true
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - id: plan
        name: Plan incremental build
        shell: bash
        env:
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          args=(
            plan
            --previous-manifest previous/fonts.json
            --previous-index previous/build-index.json
            --bootstrap-ref "$BOOTSTRAP_REF"
            --output plan.json
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$FORCE_ALL" == "true" ]]; then
            args+=(--force-all)
          fi
          python scripts/incremental_release.py "${args[@]}"
      - name: Verify reusable Release asset metadata
        if: steps.plan.outputs.has_previous_release == 'true'
        run: >-
          python scripts/incremental_release.py verify-assets
          --manifest previous/fonts.json
          --assets previous/assets.json
          --require fonts.json
      - name: Reject an existing Release that has no usable manifest
        if: steps.release.outputs.exists == 'true' && steps.plan.outputs.has_previous_release != 'true'
        run: |
          echo "Existing Release has no usable fonts.json; refusing a non-atomic bootstrap" >&2
          exit 1
      - name: Verify no-op run already has a published build index
        if: steps.plan.outputs.needs_release_update != 'true'
        run: test -f previous/build-index.json
      - uses: actions/upload-artifact@v4
        with:
          name: incremental-release-plan
          path: |
            plan.json
            previous/fonts.json
            previous/build-index.json
            previous/assets.json
            previous/notes.md
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    uses: ./.github/workflows/build-fonts.yml
    with:
      families_json: ${{ needs.plan.outputs.families_json }}
      publish_catalog: false

  assemble:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed_existing_json: ${{ needs.plan.outputs.changed_existing_json }}
      new_json: ${{ needs.plan.outputs.new_json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: incremental-release-plan
          path: state
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has_builds == 'true'
        with:
          pattern: font-*
          path: built
          merge-multiple: true
      - name: Assemble complete manifest and build index
        env:
          HAS_PREVIOUS_RELEASE: ${{ needs.plan.outputs.has_previous_release }}
          HAS_BUILDS: ${{ needs.plan.outputs.has_builds }}
        shell: bash
        run: |
          args=(
            merge
            --base-url "$FONT_BASE_URL"
            --manifest-output dist/fonts.json
            --index-output dist/build-index.json
            --commit "$GITHUB_SHA"
          )
          if [[ "$HAS_PREVIOUS_RELEASE" == "true" ]]; then
            args+=(--previous-manifest state/previous/fonts.json)
          fi
          if [[ "$HAS_BUILDS" == "true" ]]; then
            python scripts/generate_manifest.py \
              --input built \
              --base-url "$FONT_BASE_URL" \
              --output built/fonts.json \
              --descriptions-from config/fonts.yaml
            args+=(--built-manifest built/fonts.json)
          fi
          python scripts/incremental_release.py "${args[@]}"
      - name: Resolve contributing pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          if [[ -n "$pr" ]]; then
            echo "number=$pr" >> "$GITHUB_OUTPUT"
          fi
      - name: Copy changed font files and notices
        env:
          FAMILIES_JSON: ${{ needs.plan.outputs.families_json }}
          CONTRIBUTING_PR: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          if [[ "$FAMILIES_JSON" != "[]" ]]; then
            while IFS= read -r filename; do
              cp "built/$filename" "dist/$filename"
            done < <(
              python scripts/incremental_release.py list-files \
                --manifest dist/fonts.json \
                --families-json "$FAMILIES_JSON"
            )
            while IFS= read -r package; do
              cp "$package" dist/
            done < <(find built -maxdepth 1 -name '*.cpfontpkg' -print)
            python scripts/incremental_release.py verify-files \
              --manifest dist/fonts.json \
              --directory dist \
              --families-json "$FAMILIES_JSON"
          fi
          notes_args=(
            --previous-manifest state/previous/fonts.json
            --current-manifest dist/fonts.json
            --plan state/plan.json
            --output dist/RELEASE_NOTES.md
            --tag "$RELEASE_TAG"
            --previous-notes state/previous/notes.md
          )
          if [[ -n "${CONTRIBUTING_PR:-}" ]]; then
            notes_args+=(--pr "$CONTRIBUTING_PR")
          fi
          python scripts/generate_release_notes.py "${notes_args[@]}"
          cp SOURCES.md dist/FONT-SOURCES.md
      - uses: actions/upload-artifact@v4
        with:
          name: incremental-release-candidate
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-fonts:
    needs: [plan, assemble]
    if: needs.plan.outputs.has_builds == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: incremental-release-candidate
          path: dist
      - name: Create the first Release or upload changed font assets
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_PREVIOUS_RELEASE: ${{ needs.plan.outputs.has_previous_release }}
          CHANGED_EXISTING_JSON: ${{ needs.plan.outputs.changed_existing_json }}
          NEW_JSON: ${{ needs.plan.outputs.new_json }}
        shell: bash
        run: |
          if [[ "$HAS_PREVIOUS_RELEASE" != "true" ]]; then
            gh release create "$RELEASE_TAG" dist/*.cpfont dist/*.cpfontpkg \
              --target "$GITHUB_SHA" \
              --title "CrossPoint CJK fonts (manifest 2 / cpfont 4)" \
              --notes-file dist/RELEASE_NOTES.md
            exit 0
          fi

          if [[ "$CHANGED_EXISTING_JSON" != "[]" ]]; then
            while IFS= read -r filename; do
              gh release upload "$RELEASE_TAG" "dist/$filename" --clobber
            done < <(
              python scripts/incremental_release.py list-files \
                --manifest dist/fonts.json \
                --families-json "$CHANGED_EXISTING_JSON"
            )
            for family in $(python -c 'import json, os; print(" ".join(json.loads(os.environ["CHANGED_EXISTING_JSON"])))'); do
              for package in "dist/$family-ui.cpfontpkg" "dist/$family.cpfontpkg"; do
                if [[ -f "$package" ]]; then
                  gh release upload "$RELEASE_TAG" "$package" --clobber
                fi
              done
            done
          fi
          if [[ "$NEW_JSON" != "[]" ]]; then
            while IFS= read -r filename; do
              gh release upload "$RELEASE_TAG" "dist/$filename"
            done < <(
              python scripts/incremental_release.py list-files \
                --manifest dist/fonts.json \
                --families-json "$NEW_JSON"
            )
            for family in $(python -c 'import json, os; print(" ".join(json.loads(os.environ["NEW_JSON"])))'); do
              for package in "dist/$family-ui.cpfontpkg" "dist/$family.cpfontpkg"; do
                if [[ -f "$package" ]]; then
                  gh release upload "$RELEASE_TAG" "$package"
                fi
              done
            done
          fi

  verify-fonts:
    needs: [plan, assemble, publish-fonts]
    if: always() && needs.assemble.result == 'success' && (needs.publish-fonts.result == 'success' || needs.publish-fonts.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: incremental-release-candidate
          path: dist
      - name: Verify every Release asset and changed font hash
        env:
          GH_TOKEN: ${{ github.token }}
          FAMILIES_JSON: ${{ needs.plan.outputs.families_json }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json assets > assets.json
          python scripts/incremental_release.py verify-assets \
            --manifest dist/fonts.json \
            --assets assets.json
          mkdir -p remote-fonts
          if [[ "$FAMILIES_JSON" != "[]" ]]; then
            while IFS= read -r filename; do
              gh release download "$RELEASE_TAG" --pattern "$filename" --dir remote-fonts
            done < <(
              python scripts/incremental_release.py list-files \
                --manifest dist/fonts.json \
                --families-json "$FAMILIES_JSON"
            )
            python scripts/incremental_release.py verify-files \
              --manifest dist/fonts.json \
              --directory remote-fonts \
              --families-json "$FAMILIES_JSON"
          fi

  publish-metadata:
    needs: [plan, assemble, verify-fonts]
    if: always() && needs.plan.outputs.needs_release_update == 'true' && needs.assemble.result == 'success' && (needs.verify-fonts.result == 'success' || needs.verify-fonts.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: incremental-release-plan
          path: state
      - uses: actions/download-artifact@v4
        with:
          name: incremental-release-candidate
          path: dist
      - name: Publish manifest only after all font assets verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/fonts.json \
            dist/build-index.json \
            dist/FONT-SOURCES.md \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --title "CrossPoint CJK fonts (manifest 2 / cpfont 4)" \
            --notes-file dist/RELEASE_NOTES.md
      - name: Remove obsolete Release metadata assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for asset in FONT-LICENSES.md OFL-1.1.txt; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes 2>/dev/null || true
          done
      - name: Remove font assets no longer listed by the complete manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ -f state/previous/fonts.json ]]; then
            while IFS= read -r filename; do
              gh release delete-asset "$RELEASE_TAG" "$filename" --yes
            done < <(
              python scripts/incremental_release.py obsolete-files \
                --previous-manifest state/previous/fonts.json \
                --current-manifest dist/fonts.json
            )
          fi
      - name: Verify published metadata and full asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p published
          gh release download "$RELEASE_TAG" --pattern fonts.json --dir published
          gh release download "$RELEASE_TAG" --pattern build-index.json --dir published
          cmp dist/fonts.json published/fonts.json
          cmp dist/build-index.json published/build-index.json
          gh release view "$RELEASE_TAG" --json assets > published/assets.json
          python scripts/incremental_release.py verify-assets \
            --manifest published/fonts.json \
            --assets published/assets.json \
            --require fonts.json \
            --require build-index.json \
            --require FONT-SOURCES.md
